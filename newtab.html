<!DOCTYPE html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link id="favicon" rel="icon" type="image/png" href="icons/default_ico48.png">
<title>Beutifull New Tab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ══ BOOKMARKS PANEL (left side, hover-reveal) ══ -->
<div id="bm-panel" class="bm-collapsed">
  <div id="bm-content">
    <!-- #bm-header, #bm-add-panel, #bm-toolbar injected by bookmarks.js -->
    <div id="bm-tags"></div>
    <div id="bm-list"></div>
  </div>
</div>

<!-- ══ MAIN PAGE ══ -->
<div id="page">

  <div id="clock-wrap">
    <div id="clock">00:00</div>
    <div id="date"></div>
  </div>

  <div id="shortcuts-row"></div>

  <div id="search-wrap" tabindex="-1">
    <div id="dual-bar">

      <div id="search-side" tabindex="-1">
        <button id="engine-btn" type="button" tabindex="-1">
          <span id="eng-icon"><i class="fa-brands fa-google"></i></span>
          <span id="eng-label">Google</span>
        </button>
        <svg id="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input id="q" type="text" placeholder="Search…" spellcheck="false" autocomplete="off" tabindex="-1">
        <button id="clear-btn" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <div id="bar-divider"></div>

      <div id="cmd-side">
        <svg id="cmd-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>
        </svg>
        <input id="cmd" type="text" placeholder="Command…" spellcheck="false" autocomplete="off" tabindex="-1">
        <span id="cmd-hint">g · gm · calc</span>
      </div>
    </div>

    <div id="dropdown"></div>
  </div>

</div>

<!--
  Load order:
  1. storage.js     — BNT_STORAGE class + BNT_STORAGE_READY promise (auto-inits)
  2. migration.js   — one-time localStorage migration, sets BNT_MIGRATION_READY
  3. bm-folders.js  — resolves folder IDs from background, sets BNT_FOLDERS_READY
  4. mini_addons.js — small utilities (random title, favicon)
  5. main_script.js — search bar, command palette, clock, widgets
  6. bookmarks.js   — left panel (awaits BNT_STORAGE_READY + BNT_MIGRATION_READY + BNT_FOLDERS_READY)
  7. shortcuts.js   — shortcut cards row (awaits BNT_FOLDERS_READY)
-->
<script src="storage.js"></script>
<script src="migration.js"></script>
<script src="bm-folders.js"></script>
<script src="mini_addons.js"></script>
<script src="main_script.js"></script>
<script src="bookmarks.js"></script>
<script src="shortcuts.js"></script>
</body>
</html>
